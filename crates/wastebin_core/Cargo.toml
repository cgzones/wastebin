[package]
name = "wastebin_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chacha20poly1305 = "0.11.0-rc.1"
kanal = "0.1.1"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = { version = "2", default-features = false }
