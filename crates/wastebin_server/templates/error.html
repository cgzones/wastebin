{% extends "base.html" %}

{% block title_content %}: {{ lang.t("error.title") }}{% endblock %}

{% block content %}
<div class="flex-center">
  <div class="dialog">
    <h1 class="dialog-header">{{ lang.t("error.title") }}</h1>
    <div class="dialog-section">
      {{ description }}
    </div>
    <div class="dialog-section dialog-actions">
      <a class="button button-secondary" href="/">{{ lang.t("error.back") }}</a>
    </div>
  </div>
</div>
{% endblock %}
