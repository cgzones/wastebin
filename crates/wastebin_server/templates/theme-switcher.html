<div class="theme-switcher">
  {# Setting the preference stores a cookie, so it is a POST: a link would let a prefetcher or a
     "open every link" tool change the visitor's theme behind their back. `display: contents` on
     the form keeps the button itself the flex item of the switcher. #}
  <form method="post" action="/theme?pref=dark" class="contents">
    <button type="submit" class="theme-opt{% if let Theme::Dark = theme %} active{% endif %}" title="{{ lang.t("theme.dark") }}" aria-label="{{ lang.t("theme.dark") }}">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
  </form>
  <form method="post" action="/theme?pref=light" class="contents">
    <button type="submit" class="theme-opt{% if let Theme::Light = theme %} active{% endif %}" title="{{ lang.t("theme.light") }}" aria-label="{{ lang.t("theme.light") }}">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    </button>
  </form>
  <form method="post" action="/theme?pref=system" class="contents">
    <button type="submit" class="theme-opt{% if let Theme::System = theme %} active{% endif %}" title="{{ lang.t("theme.auto") }}" aria-label="{{ lang.t("theme.auto") }}">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
    </button>
  </form>
</div>
