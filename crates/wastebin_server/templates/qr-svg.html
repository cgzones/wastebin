{# Included by both QR pages; each sizes and tints it through its own container's CSS. Requires
   the including struct to expose `code` and `dark_modules()`. #}
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" aria-label="{{ lang.t("qr.label") }}" viewBox="0 0 {{ code.size() + 4 }} {{ code.size() + 4 }}" stroke="none">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <path d="{% for (x, y) in self.dark_modules() %}M{{ x + 2 }},{{ y + 2 }}h1v1h-1z {% endfor %}" fill="#000000"/>
</svg>
